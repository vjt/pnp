name: build
on: [push, pull_request]
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The PNP library: the root, which only imports, and the modules of PNP/
      # (globs = "PNP.*" in lakefile.toml, including those nobody imports).
      - uses: leanprover/lean-action@v1
        with:
          build-args: "PNP"
      # The logical footprint of the main statements, repeated at the end of the
      # log. The same lines are pinned by #guard_msgs in PNP/Main.lean: if they
      # change, the build above is already red.
      - name: axioms
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build PNP.Main 2>&1 | grep "axioms"
